# cargo-deny configuration.
#
# Scoped to advisories for now: the CI `cargo-deny` job runs
# `cargo-deny check advisories`. Bans, licenses, and sources need policy
# decisions before they're worth enabling.

[advisories]
ignore = [
  # `paste` is unmaintained (RUSTSEC-2024-0436). It is a trivial compile-time
  # token-pasting proc-macro with no runtime or security surface, pulled in
  # transitively only by `ratatui` (the `decman-cli` TUI). There is no
  # maintained drop-in until ratatui moves off it, so ignore the advisory
  # rather than block CI.
  "RUSTSEC-2024-0436",
  # h2 0.3 accepts and queues empty DATA frames without limit (RUSTSEC-2026-0258,
  # low severity: unbounded memory, or a panic if the length overflows).
  #
  # Unfixable by updating: 0.3.27 is the last 0.3.x release ever published and
  # the patch landed only in 0.4.16. It arrives via actix-http (actix-web 4,
  # `http2` on by default) and via decman's own hyper 0.14, which no longer has
  # a caller and is kept only until a follow-up drops it. Dropping hyper does
  # not clear the advisory, because actix-http still pulls h2 0.3. Unlike the
  # other entries in this file, cargo-deny flags this one too, i.e. it really
  # is in the compiled graph, not just the lockfile.
  #
  # The separate h2 0.4 instance (AWS SDK / hyper 1.x) is fixed by the 0.4.16
  # bump that accompanies this ignore.
  #
  # Drop when decman moves to hyper 1.x or actix-web ships an h2 0.4 release.
  # Tracked in #351.
  "RUSTSEC-2026-0258",
]
