# cargo-deny configuration.
#
# Scoped to advisories for now: the CI `cargo-deny` job runs
# `cargo-deny check advisories`. Bans, licenses, and sources need policy
# decisions before they're worth enabling.

[advisories]
ignore = [
  # h2 0.3 accepts and queues empty DATA frames without limit (RUSTSEC-2026-0258,
  # low severity: unbounded memory, or a panic if the length overflows).
  #
  # Unfixable by updating: 0.3.27 is the last 0.3.x release ever published and
  # the patch landed only in 0.4.16. It arrives via actix-http (actix-web 4,
  # `http2` on by default) and via hyper 0.14, which hyper-noise 0.0.3 requires
  # with `features = ["full"]` — so the feature cannot be switched off from
  # here either. cargo-deny flags it, so it really is in the compiled graph,
  # not just the lockfile.
  #
  # The separate h2 0.4 instance (AWS SDK / hyper 1.x) is fixed by the 0.4.16
  # bump that accompanies this ignore.
  #
  # Drop when hyper-noise moves off hyper 0.14 or actix-web ships an h2 0.4
  # release. Tracked in #351.
  "RUSTSEC-2026-0258",
  # SQLite before 3.54.0 can return uninitialized page-cache memory when a
  # process opens a database together with a crafted `-wal` file of another
  # page size (RUSTSEC-2026-0459). The attack is local: a less trusted party
  # must write both files. libsqlite3-sys 0.30.1 bundles an affected SQLite,
  # and cargo-deny flags it because sqlx's `sqlite` feature compiles it in.
  #
  # DecMan opens one database file at runtime: its own, in its data
  # directory, which only DecMan writes. The tests open in-memory databases.
  #
  # Unfixable by updating: the fix is in libsqlite3-sys 0.39 (SQLite 3.54),
  # and the latest sqlx (0.9.0) requires libsqlite3-sys below 0.38. Drop this
  # once a sqlx release allows 0.39 and we update to it.
  "RUSTSEC-2026-0459",
  # chrono is unmaintained (RUSTSEC-2026-0543). The advisory reports no
  # vulnerability, and it covers every version, so no update clears it.
  #
  # decman, decman-lib and decman-wallet use chrono directly. canton-lib's
  # canton-api-client and common crates also pull it in, so a move to jiff or
  # time here alone would still leave chrono in the graph. Drop this once
  # canton-lib and this workspace have both moved off chrono.
  "RUSTSEC-2026-0543",
]
