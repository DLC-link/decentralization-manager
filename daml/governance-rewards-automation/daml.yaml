dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../governance-action-v1/.daml/dist/governance-action-v1-0.1.0.dar
  - ../dars/splice-wallet-0.1.18.dar
  # 0.1.19 exposes the concrete RewardCouponV2 that Delegation_Assign pins to.
