sdk-version: 3.4.11
name: governance-rewards-automation-v1-rc1
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../governance-action-v1/.daml/dist/governance-action-v1-0.1.0.dar
  - ../dars/splice-wallet-0.1.18.dar
  # 0.1.19 (not 0.1.17) so Delegation_Assign can pin the coupon to the concrete
  # RewardCouponV2 template; 0.1.17 predates it.
  - ../dars/splice-amulet-0.1.19.dar
  - ../dars/splice-api-reward-assignment-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
build-options:
  - --target=2.2
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
