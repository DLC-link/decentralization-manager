sdk-version: 3.5.1
name: governance-utility-onboarding-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
# Same splice and utility packages as governance-utility-onboarding. The
# test harness is vendored as source in daml/TestHarness.daml, because
# testlib-0.1.0.dar embeds the daml-script of SDK 3.4.11, whose Script type
# differs from the one in 3.5.1.
data-dependencies:
  - ../governance-action-v1/.daml/dist/governance-action-v1-0.1.0.dar
  - ../governance-core/.daml/dist/governance-core-v1-0.2.0.dar
  - ../governance-utility-onboarding/.daml/dist/governance-utility-onboarding-v1-0.9.0.dar
  - ../dars/splice-amulet-0.1.22.dar
  - ../dars/splice-api-featured-app-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-util-0.1.7.dar
  - ../dars/utility-commercials-v0-0.4.2.dar
  - ../dars/utility-credential-app-v0-0.4.3.dar
  - ../dars/utility-credential-v0-0.1.2.dar
  - ../dars/utility-registry-app-v0-0.9.2.dar
  - ../dars/utility-registry-holding-v0-0.3.2.dar
  - ../dars/utility-registry-v0-0.8.2.dar
build-options:
  - --target=2.3
  - -Wno-upgrade-interfaces
  - -Wno-template-interface-depends-on-daml-script
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
