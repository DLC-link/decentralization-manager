  - ../governance-action-v1/.daml/dist/governance-action-v1-0.1.0.dar
  - ../governance-core/.daml/dist/governance-core-v1-0.1.0.dar
  - ../governance-core-test/.daml/dist/governance-core-test-0.1.0.dar
