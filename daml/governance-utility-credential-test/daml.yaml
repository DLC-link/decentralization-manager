sdk-version: 3.5.1
name: governance-utility-credential-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../governance-action-v1/.daml/dist/governance-action-v1-0.1.0.dar
  - ../governance-core/.daml/dist/governance-core-v1-0.2.0.dar
  - ../governance-utility-credential/.daml/dist/governance-utility-credential-v1-0.2.0.dar
  - ../dars/utility-credential-app-v0-0.4.3.dar
  - ../dars/utility-credential-v0-0.1.2.dar
module-prefixes:
  splice-amulet-0.1.22: CredentialApp
build-options:
  - --target=2.3
  - -Wno-upgrade-interfaces
  - -Wno-template-interface-depends-on-daml-script
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
