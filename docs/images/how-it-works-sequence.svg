<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1006" width="1640" height="1006" role="img" aria-labelledby="t d">
<title id="t">Approve and execute a governed action</title>
<desc id="d">Alice and Bob are two of the three member parties of a Decentralized Party. The governance threshold is 2 of 3. Alice proposes a transfer and confirms it. Bob confirms it and executes it. GovernanceRules executes the action with the authority of the Decentralized Party. The action transfers the tokens, and GovernanceRules records the result. The hosts confirm the transaction. Below a dashed line, one note shows a path outside the governance vote. Two node operators meet the namespace threshold, so their Daml signing keys can submit any transaction as the Decentralized Party.</desc>
