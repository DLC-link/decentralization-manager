name: Release

on:
  push:
    tags:
      - v[0-9]*

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  binary:
    needs: ci
    uses: ./.github/workflows/build-binary.yml
    with:
      profile: release
    secrets: inherit

  docker:
    name: Build & Push Public Image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dec-party-manager
          path: ctx

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::903295530547:role/gh-oidc-build-decentralization-manager
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Extract version from tag
        id: tag
        run: echo "version_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tiny build context: just the binary in ctx/ + the runtime Dockerfile, so
      # there's no repo upload to the buildkit daemon and nothing to compile.
      - name: Build and push to ECR Public
        env:
          VERSION_TAG: ${{ steps.tag.outputs.version_tag }}
        run: |
          docker buildx build ctx -f Dockerfile \
            -t public.ecr.aws/dlc-link/decentralization-manager:$VERSION_TAG \
            --push
