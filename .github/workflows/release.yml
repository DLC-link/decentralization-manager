name: Release

on:
  push:
    tags:
      - v[0-9]*

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  docker:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::903295530547:role/gh-oidc-build-decentralization-manager
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Extract version from tag
        id: tag
        run: echo "version_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - name: Build and push to ECR Public
        env:
          VERSION_TAG: ${{ steps.tag.outputs.version_tag }}
        run: |
          echo "VITE_ADMIN_ACCESS=true" > crates/decman/frontend/.env
          docker buildx build --ssh default \
            -t public.ecr.aws/dlc-link/decentralization-manager:$VERSION_TAG \
            --push .
