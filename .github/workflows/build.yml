name: Build

# Per-commit dev images: on every push to any branch, build the binary (fast
# profile, no optimization — throwaway images) and push it to the private ECR
# repo tagged with the short git SHA. Tags are excluded here — those are built
# and pushed to the public repo by release.yml instead.
on:
  push:
    branches:
      - "**"

jobs:
  binary:
    uses: ./.github/workflows/build-binary.yml
    with:
      profile: fast
    secrets: inherit

  docker:
    name: Build & Push Private Image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dec-party-manager
          path: ctx

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::903295530547:role/gh-oidc-build-decentralization-manager
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR (private)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tiny build context: just the binary in ctx/ + the runtime Dockerfile, so
      # there's no repo upload to the buildkit daemon and nothing to compile.
      - name: Build and push to ECR (private)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          cp Dockerfile ctx/Dockerfile
          docker buildx build ctx \
            --build-arg DECPM_BUILD_VERSION=$SHORT_SHA \
            --build-arg DECPM_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $ECR_REGISTRY/decentralization-manager:$SHORT_SHA \
            --push
