name: Build

# Per-commit dev images: on every push to any branch, build the binary (fast
# profile, no optimization — throwaway images) and push it to the private ECR
# repo tagged with the short git SHA. Tags are excluded here — those are built
# and pushed to the public repo by release.yml instead.
on:
  push:
    branches:
      - "**"

jobs:
  # Compile everything on the runner (not in Docker) so the heavy caching lives
  # in Swatinem/rust-cache and an actions/cache for the frontend bundle. The job
  # runs in rust:slim-bookworm so the binary links against the same glibc/openssl
  # that the distroless/cc-debian12 runtime image ships.
  binary:
    name: Build Binary (fast profile)
    runs-on: ubuntu-latest
    container: rust:slim-bookworm
    # mold is a much faster linker; used via RUSTFLAGS below. Set at job level so
    # every cargo invocation (gen-types + the binary build) shares one fingerprint
    # and reuses the compiled dependency graph.
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-packages: mold

      - name: Setup Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fast-image
          cache-on-failure: "true"

      # The frontend imports frontend/src/types.generated.ts (gitignored), so the
      # bindings must be generated from the Rust DTOs before the frontend builds.
      - name: Generate frontend TypeScript bindings
        run: DECMAN_SKIP_FRONTEND=1 cargo run --profile fast -p decman --features typegen --bin gen-types

      # Cache the built frontend bundle keyed on the *content* of the frontend
      # sources + the just-generated bindings. This is what fixes the "frontend
      # rebuilds every commit" problem: cargo's build.rs keys on mtimes (which a
      # fresh checkout always bumps), but hashFiles is content-based, so a commit
      # that doesn't touch the frontend or the DTOs is a cache hit and skips the
      # ~minutes-long tsc + vite build entirely.
      - name: Cache frontend bundle
        id: fe-cache
        uses: actions/cache@v6
        with:
          path: crates/decman/frontend/dist
          key: fe-dist-${{ hashFiles('crates/decman/frontend/src/**', 'crates/decman/frontend/package-lock.json', 'crates/decman/frontend/index.html', 'crates/decman/frontend/vite.config.ts', 'crates/decman/frontend/tsconfig*.json') }}

      - name: Build frontend
        if: steps.fe-cache.outputs.cache-hit != 'true'
        working-directory: crates/decman/frontend
        run: |
          echo "VITE_ADMIN_ACCESS=true" > .env
          npm ci
          npm run build

      # DECMAN_SKIP_FRONTEND=1 tells build.rs not to rebuild the frontend — the
      # bundle above is already in frontend/dist and rust-embed embeds it as-is.
      - name: Build binary
        run: DECMAN_SKIP_FRONTEND=1 cargo build --profile fast -p decman

      - name: Stage binary for artifact
        run: cp target/fast/dec-party-manager dec-party-manager

      - uses: actions/upload-artifact@v7
        with:
          name: dec-party-manager
          path: dec-party-manager
          retention-days: 1

  docker:
    name: Build & Push Private Image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dec-party-manager
          path: ctx

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::903295530547:role/gh-oidc-build-decentralization-manager
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR (private)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tiny build context: just the binary + the runtime Dockerfile, so there's
      # no repo upload to the buildkit daemon and nothing to compile.
      - name: Build and push to ECR (private)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          chmod +x ctx/dec-party-manager
          docker buildx build ctx -f Dockerfile.runtime \
            -t $ECR_REGISTRY/decentralization-manager:$SHORT_SHA \
            --push
