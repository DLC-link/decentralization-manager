[workspace]
members = [
    "crates/common",
    "crates/decman",
    "crates/decman-cli",
    "crates/decman-lib",
    "crates/decman-wallet",
]
resolver = "2"

# Shared dependency versions. Member crates reference these with
# `<dep> = { workspace = true }` (adding crate-specific features or `optional`
# on top), so a version lives in exactly one place. Keep alphabetical: the
# crates.io block first, then a blank line and the git/path deps.
[workspace.dependencies]
actix-cors = { version = "0.7" }
actix-web = { version = "4" }
aes-gcm = { version = "0.11" }
anyhow = { version = "1.0.98" }
async-trait = { version = "0.1" }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = { version = "0.23" }
bytes = { version = "1.11.1" }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
clap = { version = "4.5.43", features = ["derive", "env"] }
colored = { version = "3.1.1" }
dotenvy = { version = "0.15" }
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
futures = { version = "0.3" }
hex = { version = "0.4" }
http = { version = "0.2" }
hyper = { version = "0.14", features = ["full"] }
hyper-noise = { version = "0.0.3" }
insta = { version = "1", features = ["json"] }
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
mime_guess = { version = "2.0" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
prost = { version = "0.14.1" }
prost-types = { version = "0.14.1" }
rand = { version = "0.10" }
ratatui = { version = "0.30.2" }
# `reqwest` is intentionally NOT a workspace dependency: the server (`decman`)
# is on 0.13 while the CLI (`decman-cli`) is on 0.12 (semver-incompatible), and
# 0.13 reorganized features / the blocking API. Each crate pins its own until
# the CLI is migrated to 0.13 in a dedicated change.
# `wayland` is dropped from the default features: it is the only path to
# `wayland-scanner` -> `quick-xml` (a crafted-XML DoS surface, RUSTSEC-2026-0194/
# -0195), and a terminal app has no Wayland window handle to parent a dialog to
# anyway. The portal backend (`xdg-portal`) is the appropriate Linux dialog.
rcgen = { version = "0.14" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rust-embed = { version = "8.5" }
secp256k1 = { version = "0.29.1", features = ["rand-std"] }
semver = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = { version = "0.5.1" }
serde_json = { version = "1.0" }
sha2 = { version = "0.11" }
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio-rustls",
    "sqlite",
] }
static_assertions = { version = "1.1" }
tempfile = { version = "3.14" }
thiserror = { version = "2.0" }
tokio = { version = "1.48.0", features = [
    "fs",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tokio-noise = { version = "0.0.5" }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
] }
tokio-stream = { version = "0.1" }
toml = { version = "1.1.2" }
tonic = { version = "0.14.2", features = [
    "tls-aws-lc",
    "tls-native-roots",
] }
tonic-prost = { version = "0.14.2" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
utoipa = { version = "5" }
utoipa-actix-web = { version = "0.1" }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1.11", features = ["v4"] }
wiremock = { version = "0.6" }
x509-parser = { version = "0.18" }
zeroize = { version = "1.8", features = ["derive"] }

canton-common = { package = "common", git = "https://github.com/DLC-link/canton-lib", rev = "651ea5221b4794f55bd152e9f3e762a92af69afd" }
canton-proto-rs = { git = "https://github.com/DLC-link/canton-lib", rev = "651ea5221b4794f55bd152e9f3e762a92af69afd" }
canton-registry = { package = "registry", git = "https://github.com/DLC-link/canton-lib", rev = "651ea5221b4794f55bd152e9f3e762a92af69afd" }
common = { path = "crates/common" }
decman-lib = { path = "crates/decman-lib" }
decman-wallet = { path = "crates/decman-wallet" }
keycloak = { git = "https://github.com/DLC-link/canton-lib", rev = "651ea5221b4794f55bd152e9f3e762a92af69afd" }

[profile.release]
opt-level = 3
strip = "debuginfo"
codegen-units = 1
lto = true
panic = "unwind"

# CI-only profile for integration tests. Inherits release-level optimizations
# but disables LTO and bumps codegen-units so the build finishes in a fraction
# of the time. The shipped release profile is unaffected.
[profile.release-ci]
inherits = "release"
codegen-units = 16
lto = false
strip = "none"

# Fastest-to-compile profile, used for the per-commit private dev images
# (build.yml). opt-level 0 (from dev) + no LTO + no debuginfo + max
# codegen-units: these are throwaway images where compile speed is all that
# matters and runtime performance does not. incremental is off for the same
# reason CI turns it off elsewhere — the cache is restored fresh each run, so
# per-fn incremental only adds size and slowdown.
[profile.fast]
inherits = "dev"
debug = false
incremental = false
# rust-embed only embeds frontend/dist at compile time when debug_assertions is
# off (otherwise it loads the folder from disk at runtime, which doesn't exist in
# the container → 404). opt-level stays 0, so this keeps the fast compile.
debug-assertions = false
