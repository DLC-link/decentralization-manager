[package]
name = "decman-wallet"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Wallet-side client for DecMan's tenant API: run a co-validated Canton party from a key you hold yourself"

[lib]
name = "decman_wallet"
path = "src/lib.rs"

# The demo wallet: a local web app that drives the library end to end. Behind the
# `demo` feature so a wallet provider depending on this crate for the client does
# not inherit an HTTP server and an embedded UI bundle.
[[bin]]
name = "decman-wallet-demo"
path = "src/bin/demo.rs"
required-features = ["demo"]

[features]
demo = [
    "dep:actix-web",
    "dep:clap",
    "dep:mime_guess",
    "dep:rust-embed",
    "dep:tokio",
    "dep:tracing-subscriber",
]

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

common = { workspace = true }

actix-web = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
